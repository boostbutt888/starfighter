<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071015"><meta name="apple-mobile-web-app-capable" content="yes"><title>Starfighter · Rebel Command</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071015;color:#eef0e6;font-family:system-ui,sans-serif;overscroll-behavior:none;touch-action:none}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}#glcanvas{display:block;width:100%;height:100%;outline:0;touch-action:none;user-select:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at 50% 20%,#233a47,#071015 65%);padding:35px;z-index:2}#loading[hidden]{display:none}h1{font-size:clamp(35px,8vw,65px);letter-spacing:5px;margin:10px 0;color:#f3bd69}.eyebrow{font-size:11px;letter-spacing:4px;color:#aac5cb}#status{color:#acbec4;font-size:14px;max-width:380px;line-height:1.7}progress{width:100%;accent-color:#f3bd69;height:4px;margin:20px 0}small{color:#6f929d;font-size:10px;letter-spacing:2px}</style></head><body><canvas id="glcanvas" tabindex="0" aria-label="Starfighter Rust arcade game. Choose Rookie, Pilot or Legend and your Rebel fighter. Drag to steer and fire automatically. Top right: pause and mute. Bottom right: bomb."></canvas><div id="loading" role="status"><span class="eyebrow">REBEL COMMAND</span><h1>STARFIGHTER</h1><progress id="progress" max="1"></progress><p id="status">Preparing the flight deck…</p><small>FIVE WORLDS. ONE REBELLION.</small></div><script src="mq_js_bundle.js"></script><script>
const loading=document.getElementById('loading'),statusText=document.getElementById('status'),progress=document.getElementById('progress');let ready=false;
miniquad_add_plugin({name:'starfighter_ui',version:1,register_plugin(imports){imports.env.starfighter_ready=()=>{ready=true;loading.hidden=true;canvas.focus()}}});
function failed(t){if(!ready)statusText.textContent=t}
fetch('starfighter.wasm?v=0.4.0', {cache:'no-cache'}).then(async response=>{if(!response.ok)throw Error('Download failed');const total=Number(response.headers.get('content-length'))||0,reader=response.body.getReader();let chunks=[],length=0;while(true){let {value,done}=await reader.read();if(done)break;chunks.push(value);length+=value.length;progress.value=total?length/total:0;statusText.textContent=`Loading flight assets… ${(length/1048576).toFixed(1)} MB${total?' / '+(total/1048576).toFixed(1)+' MB':''}`}statusText.textContent='Rendering spacecraft and composing the score…';const bytes=new Uint8Array(length);let offset=0;for(let c of chunks){bytes.set(c,offset);offset+=c.length}let url=URL.createObjectURL(new Blob([bytes],{type:'application/wasm'}));load(url);setTimeout(()=>URL.revokeObjectURL(url),60000)}).catch(()=>failed('Could not load the game. Keep the computer running and connect to the same Wi-Fi, then reload.'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&typeof wasm_exports!=='undefined'&&wasm_exports.starfighter_pause)wasm_exports.starfighter_pause()});canvas.addEventListener('pointerdown',()=>canvas.focus());canvas.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('error',e=>failed('The flight deck could not start. Reload in Chrome or Safari with WebGL enabled.'));window.addEventListener('unhandledrejection',()=>failed('Loading interrupted. Please reload.'));
</script></body></html>
